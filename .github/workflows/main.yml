name: Build so3 IPA

on:
  workflow_dispatch:
    inputs:
      gadget_version:
        description: 'Версия Frida gadget'
        required: false
        default: '16.2.2'
      output_name:
        description: 'Имя готового .ipa без расширения'
        required: false
        default: 'so3'

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build insert_dylib
        run: |
          git clone --depth 1 https://github.com
          clang -O2 -o insert_dylib_bin insert_dylib/insert_dylib/main.c
          chmod +x insert_dylib_bin
          sudo mkdir -p /usr/local/bin
          sudo mv insert_dylib_bin /usr/local/bin/insert_dylib

      - name: Obtain source IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download --pattern '*.ipa' --dir . --clobber --repo "$GITHUB_REPOSITORY"
          SRC="$(find . -maxdepth 1 -name '*.ipa' -type f | head -n1)"
          if [ -z "$SRC" ] || [ ! -s "$SRC" ]; then
            echo "Ошибка: сначала загрузите исходный .ipa в Releases этого репозитория" >&2
            exit 1
          fi
          mv "$SRC" game.ipa

      - name: Build IPA
        run: |
          bash tools/package-gadget.sh game.ipa "${{ github.event.inputs.gadget_version }}"
          mv game-gadget.ipa "${{ github.event.inputs.output_name }}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}-ipa
          path: ${{ github.event.inputs.output_name }}.ipa
