name: Build so3 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Раскомментируйте две строки ниже, если в репозитории есть project.yml (XcodeGen):
      # - name: Generate Xcode project
      #   run: brew install xcodegen && xcodegen generate

      - name: Build App without signing
        run: |
          xcodebuild -project so3.xcodeproj \
            -scheme so3 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/build

      - name: Package into IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/build/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r so3.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: so3-ipa
          path: ${{ runner.temp }}/so3.ipa
